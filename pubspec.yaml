name: test_ap_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  cloud_firestore: ^7.1.0

  # Health Connect integration
  health: ^13.3.2
  permission_handler: ^12.0.3

  # Google Calendar integration
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  # GPS and interactive route maps
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

# Loading screen
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/trailblazer_logo.png

  android_12:
    image: assets/images/trailblazer_logo.png
    icon_background_color: "#FFFFFF"

# App icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icons/trailblazer_icon.png"
  remove_alpha_ios: true
  addadaptive_icon_background: "#FFFFFF"
  addadaptive_icon_foreground: "assets/images/icons/trailblazer_icon.png"
  addadaptive_icon_monochrome: "assets/images/icons/monochrome_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
